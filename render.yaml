# Render Blueprint — deploy backend ฟรี (ดูขั้นตอนใน README_DEPLOY.md)
# วิธีใช้: Render Dashboard → New → Blueprint → เลือก repo นี้ → บอกให้ใช้ไฟล์นี้
services:
  - type: web
    name: smart-task-manager-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./smart-task-manager/Dockerfile
    dockerContext: ./smart-task-manager
    # Render free ต้องเปิดไว้ตัวเดียว — database สร้างอัตโนมัติ (Postgres free หมดอายุ 30 วัน ดู runbook)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smarttaskdb
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BACKGROUND_WORKER
        value: "1"

databases:
  - name: smarttaskdb
    plan: free
