name: Backend checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: "sqlite:///:memory:"
      BACKGROUND_WORKER: "0"
      GROQ_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r smart-task-manager/requirements-dev.txt
      - name: Syntax check
        run: |
          find . -name "*.py" -print0 | xargs -0 -n1 python -m py_compile
      - name: Run backend tests
        working-directory: smart-task-manager
        run: python -m pytest tests -q
